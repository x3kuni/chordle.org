name: Deploy Chordle Current-Main Prototype

on:
  push:
    branches:
      - prototype/current-main-polish-20261003
  workflow_dispatch:

concurrency:
  group: chordle-current-main-prototype
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate generated browser scripts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {spawnSync} from 'node:child_process';
          import worker from './worker.js';

          const source=fs.readFileSync('./public/index.html','utf8');
          const env={
            ASSETS:{
              async fetch(){
                return new Response(source,{headers:{'content-type':'text/html; charset=UTF-8'}});
              }
            }
          };

          const response=await worker.fetch(new Request('https://prototype.local/'),env);
          const html=await response.text();
          const scripts=[...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);

          console.log('Generated inline scripts:',scripts.length);
          console.log('Pacific day helper:',html.includes('CHORDLE_PACIFIC_DAY_FORMATTER'));
          console.log('Final badge dedupe:',html.includes('new Map(wholeChordBadges(notes).map'));

          for(let i=0;i<scripts.length;i++){
            const file='/tmp/chordle-inline-'+i+'.js';
            fs.writeFileSync(file,scripts[i]);
            const result=spawnSync(process.execPath,['--check',file],{encoding:'utf8'});
            if(result.status!==0){
              console.error(result.stderr||result.stdout);
              process.exit(result.status||1);
            }
          }

          const authCheck=spawnSync(process.execPath,['--check','./public/auth.js'],{encoding:'utf8'});
          if(authCheck.status!==0){
            console.error(authCheck.stderr||authCheck.stdout);
            process.exit(authCheck.status||1);
          }
          NODE

      - name: Deploy Chordle prototype
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: preview --name current-main-polish

      - name: Smoke test live prototype
        shell: bash
        run: |
          set -euo pipefail
          URL="https://current-main-polish-chordle.gtownsend707.workers.dev"
          sleep 3

          curl -fsSL "$URL" -o /tmp/chordle-live.html
          grep -q 'current-main-polish-20261003-1' /tmp/chordle-live.html

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome unavailable; static fetch passed."
            exit 0
          fi

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom "$URL" > /tmp/home.html 2>/tmp/home.log
          KEY_COUNT="$(grep -o 'data-note="' /tmp/home.html | wc -l | tr -d ' ')"
          echo "Rendered piano key count: $KEY_COUNT"
          test "$KEY_COUNT" -ge 30

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom "$URL/#leaderboard" > /tmp/leaderboard.html 2>/tmp/leaderboard.log
          grep -q 'leaderboard-route' /tmp/leaderboard.html
          grep -q 'leaderboardNavBtn' /tmp/leaderboard.html

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom "$URL/#profile" > /tmp/profile.html 2>/tmp/profile.log
          grep -q 'profile-route' /tmp/profile.html
          grep -q 'profileNavBtn' /tmp/profile.html

          echo "Home, leaderboard, and profile route smoke tests passed."
