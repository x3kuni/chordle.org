name: Deploy Chordle Layout Prototype

on:
  push:
    branches:
      - prototype/layout-spacing-20261003
  workflow_dispatch:

concurrency:
  group: chordle-layout-prototype
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Inspect core Chordle engine
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path("public/index.html").read_text(encoding="utf-8")
          terms=[
              "mock-roll-layout",
              "mock-roll-score-block",
              "score-rarity",
              "REVEAL_DELAY",
              "const ordinaryBadges",
              "const ordinary=",
              "const badges=analyze",
              "analyze(notes)",
              "refreshChordDate",
              "function dailyRoll"
          ]
          lines=text.splitlines()
          for term in terms:
              print("\n===== TERM:", term, "=====")
              hits=[i for i,line in enumerate(lines) if term in line]
              for i in hits[:8]:
                  a=max(0,i-12); b=min(len(lines),i+35)
                  print(f"--- lines {a+1}-{b} ---")
                  for n in range(a,b):
                      print(f"{n+1}: {lines[n]}")
          PY

      - name: Deploy Chordle layout prototype
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: preview --name layout-prototype
