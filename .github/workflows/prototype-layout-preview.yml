name: Deploy Chordle Layout Prototype

on:
  push:
    branches:
      - prototype/layout-spacing-20261003
  workflow_dispatch:

concurrency:
  group: chordle-layout-prototype
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Worker-generated browser scripts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import worker from './worker.js';

          const source=fs.readFileSync('./public/index.html','utf8');
          const env={
            ASSETS:{
              async fetch(){
                return new Response(source,{headers:{'content-type':'text/html; charset=UTF-8'}});
              }
            }
          };
          const response=await worker.fetch(new Request('https://prototype.local/'),env);
          const html=await response.text();
          fs.writeFileSync('/tmp/chordle-generated.html',html);

          const scripts=[...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          console.log('Generated inline scripts:',scripts.length);
          console.log('Pacific helper present:',html.includes("CHORDLE_PACIFIC_TIME_ZONE='America/Los_Angeles'"));
          console.log('Replay dedupe present:',html.includes('existingBadgeKeys=new Set(currentBadges.map'));

          for(let i=0;i<scripts.length;i++){
            const path='/tmp/chordle-inline-'+i+'.js';
            fs.writeFileSync(path,scripts[i]);
            const {spawnSync}=await import('node:child_process');
            const result=spawnSync(process.execPath,['--check',path],{encoding:'utf8'});
            if(result.status!==0){
              console.error('Inline script '+i+' failed syntax check');
              console.error(result.stderr||result.stdout);
              process.exit(result.status||1);
            }
          }
          const {spawnSync}=await import('node:child_process');
          const authCheck=spawnSync(process.execPath,['--check','./public/auth.js'],{encoding:'utf8'});
          if(authCheck.status!==0){
            console.error('auth.js failed syntax check');
            console.error(authCheck.stderr||authCheck.stdout);
            process.exit(authCheck.status||1);
          }
          NODE

      - name: Deploy Chordle layout prototype
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: preview --name layout-prototype

      - name: Smoke test deployed prototype
        shell: bash
        run: |
          set -euo pipefail
          URL="https://layout-prototype-chordle.gtownsend707.workers.dev"
          sleep 3
          curl -fsSL "$URL" -o /tmp/chordle-live.html
          grep -q 'id="piano"' /tmp/chordle-live.html

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome not available; static preview fetch passed."
            exit 0
          fi

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=7000 --dump-dom "$URL" > /tmp/chordle-live-dom.html 2>/tmp/chordle-chrome.log || {
            cat /tmp/chordle-chrome.log
            exit 1
          }

          KEY_COUNT="$(grep -o 'data-note="' /tmp/chordle-live-dom.html | wc -l | tr -d ' ')"
          echo "Rendered piano key count: $KEY_COUNT"
          if [ "$KEY_COUNT" -lt 30 ]; then
            echo "Piano did not initialize correctly."
            cat /tmp/chordle-chrome.log
            exit 1
          fi
