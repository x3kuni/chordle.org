name: Deploy Chordle Layout Prototype

on:
  push:
    branches:
      - prototype/layout-spacing-20261003
  workflow_dispatch:

concurrency:
  group: chordle-layout-prototype
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Deploy Chordle layout prototype
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: preview --name layout-prototype
