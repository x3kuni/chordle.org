name: Chordle Prototype Diagnostics
on:
  push:
    branches:
      - prototype/current-main-polish-20261003
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect engine snippets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path("public/index.html").read_text(encoding="utf-8")
          lines=text.splitlines()
          terms=["function analyze(notes)","return b;","async function reveal(notes","function createLeaderboardRow","function createMockRollCard","const REVEAL_DELAY","function refreshChordDate","function dailyRoll","function localDayKey","function updateNextChordCountdown"]
          for term in terms:
              print("\n===== "+term+" =====")
              for i,line in enumerate(lines):
                  if term in line:
                      a=max(0,i-10); b=min(len(lines),i+60)
                      for n in range(a,b):
                          print(f"{n+1}: {lines[n]}")
                      break
          PY
