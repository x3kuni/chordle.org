name: Deploy Chordle Mobile Leaderboard Prototype

on:
  push:
    branches:
      - prototype/mobile-leaderboard-cards-20261004
  workflow_dispatch:

concurrency:
  group: chordle-mobile-leaderboard-prototype
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out mobile leaderboard prototype
        uses: actions/checkout@v6

      - name: Deploy isolated mobile leaderboard prototype
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name mobile-leaderboard-cards-chordle
