name: Deploy Chordle Anonymous Guardrails Prototype

on:
  push:
    branches:
      - prototype/anonymous-roll-guardrails-20261004
  workflow_dispatch:

concurrency:
  group: chordle-anonymous-guardrails-prototype
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out anonymous guardrails prototype
        uses: actions/checkout@v6

      - name: Deploy isolated anonymous guardrails prototype
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name anonymous-roll-guardrails-chordle
