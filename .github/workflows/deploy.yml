name: Deploy Chordle Leaderboard Count Prototype

on:
  push:
    branches:
      - prototype/fix-leaderboard-badge-counts-20261004
  workflow_dispatch:

concurrency:
  group: chordle-leaderboard-count-prototype
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out leaderboard prototype
        uses: actions/checkout@v6

      - name: Deploy isolated leaderboard prototype
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name leaderboard-badge-counts-chordle
