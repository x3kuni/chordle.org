name: Deploy Chordle Badge Existence Prototype

on:
  push:
    branches:
      - prototype/fix-badge-existence-pagination-20261003
  workflow_dispatch:

concurrency:
  group: chordle-badge-existence-prototype
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out prototype branch
        uses: actions/checkout@v6

      - name: Deploy isolated Chordle prototype
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name badge-existence-fix-chordle
